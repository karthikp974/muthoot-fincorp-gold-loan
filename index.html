<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Muthoot FinCorp</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-topbar">
      <div>India's Trusted NBFC</div>
      <div>Customer Care: <span>1800 102 1616</span></div>
    </div>

    <main class="login-main">
      <div class="login-wrapper">
        <div class="login-brand">
          <h1>Muthoot FinCorp</h1>
          <p>Gold Loan · MSME Loan · Forex · eSwarna</p>
        </div>

        <div class="login-card">
          <h2>Customer Login</h2>
          <p class="login-sub">Sign in to view your loans and account activity</p>

          <div class="login-error" id="loginError"></div>

          <form id="loginForm">
            <div class="form-group">
              <label for="username">Name</label>
              <input type="text" id="username" name="username" placeholder="Enter your name" required autocomplete="username">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Login</button>
          </form>
        </div>

        <div class="login-features">
          <div class="login-feature">
            <strong>9.95%*</strong>
            Starting Interest Rate
          </div>
          <div class="login-feature">
            <strong>138+</strong>
            Years of Trust
          </div>
          <div class="login-feature">
            <strong>4500+</strong>
            Branches Nationwide
          </div>
        </div>

        <p class="login-footer">&copy; 2026 Muthoot FinCorp Ltd. All rights reserved.</p>
      </div>
    </main>
  </div>

  <script src="login.js"></script>
</body>
</html>
